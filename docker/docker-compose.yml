version: "3.9"

# Run from the project root with:
#   docker compose -f docker/docker-compose.yml up --build
#
# Requires models/ and mlruns/ to already exist locally (train the model
# first with `python -m src.models.train`) — they're mounted as volumes
# so the containers see whatever's on disk without being baked into the image.

services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: nids-api
    ports:
      - "8000:8000"
    volumes:
      - ../models:/app/models
      - ../logs:/app/logs
    restart: unless-stopped

  mlflow-ui:
    image: python:3.11-slim
    container_name: nids-mlflow-ui
    working_dir: /app
    volumes:
      - ..:/app
    command: >
      bash -c "pip install --no-cache-dir mlflow==2.15.1 &&
               mlflow ui --backend-store-uri file:/app/mlruns --host 0.0.0.0 --port 5000"
    ports:
      - "5000:5000"

  dashboard:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: nids-dashboard
    working_dir: /app
    volumes:
      - ../models:/app/models
      - ../logs:/app/logs
      - ../mlruns:/app/mlruns
      - ../dashboard:/app/dashboard
      - ../data:/app/data
    command: >
      bash -c "pip install --no-cache-dir streamlit==1.37.1 &&
               streamlit run dashboard/app.py --server.address 0.0.0.0 --server.port 8501"
    ports:
      - "8501:8501"
    depends_on:
      - api
